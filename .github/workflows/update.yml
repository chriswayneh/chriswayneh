name: Update profile
on:
  schedule: [{cron: "17 13 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: profile-update, cancel-in-progress: true}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Regenerate Recently shipped and languages.svg
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Commit if changed
        run: |
          git add README.md assets/languages.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update recently shipped and languages" && git push
